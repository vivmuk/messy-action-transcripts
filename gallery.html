<!DOCTYPE html>
<html lang="en">
<head>

<title>Gallery — Messy Action</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<body>

<header>
  <div class="nav">
    <a class="logo" href="index.html">Messy<span class="dot">•</span>Action</a>
    <div class="creator">by <a href="https://www.instagram.com/gracebrodeur/" target="_blank" rel="noopener">@gracebrodeur</a></div>
    <div class="spacer"></div>
    <a class="pill" href="index.html">Home</a>
    <a class="pill active" href="gallery.html">Gallery</a>
    <a class="pill teal" href="https://www.instagram.com/gracebrodeur/" target="_blank" rel="noopener">Instagram ↗</a>
    <span class="pill teal" id="pillCount">— episodes</span>
  </div>
</header>

<main>
  <!-- ALL DAYS GALLERY -->
  <section id="gallerySec">
    <div class="section-head" style="margin-top:20px;">
      <h2><span class="tape"></span>All Days Gallery</h2>
      <p>Browse the complete archive of visual field notes and key takeaways.</p>
    </div>
    <div class="gallery-grid" id="galleryGrid"></div>
  </section>
</main>

<footer>
  <div><b>Messy Action Archive</b> · Daily field notes by <a href="https://www.instagram.com/gracebrodeur/" target="_blank" rel="noopener">@gracebrodeur</a></div>
  <div style="margin-top:6px; font-size:.8rem; opacity:.7">Deployed on Railway · AI Transcripts & Infographics</div>
</footer>

<!-- LIGHTBOX FOR FULL PICTURE -->
<div id="lightbox">
  <div class="lb-content">
    <button class="lb-close" id="lbClose">✕</button>
    <div class="lb-img-wrap">
      <img id="lbImg" src="" alt="Full size infographic">
    </div>
    <div class="lb-actions">
      <button class="lb-btn secondary" id="lbViewTranscript">📜 Read Full Transcript</button>
      <a class="lb-btn primary" id="lbWatchReel" href="#" target="_blank" rel="noopener">▶ Watch Reel on IG</a>
    </div>
  </div>
</div>

<!-- FULL TRANSCRIPT / DETAIL MODAL -->
<div id="modal"></div>

<script src="app.js"></script>
</body>
