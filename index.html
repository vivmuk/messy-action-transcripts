<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>messy-action // terminal</title>
<style>
  :root {
    --bg: #0a0e0a;
    --bg2: #0d130d;
    --fg: #b8f5c0;
    --dim: #5f8f66;
    --bright: #eaffea;
    --accent: #00d4aa;
    --warn: #ffd97a;
    --err: #ff6b6b;
    --line: #1c2a1e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(ellipse at 50% 0%, #0f1a10 0%, var(--bg) 60%);
    color: var(--fg);
    font-family: "SF Mono", "Menlo", "Monaco", "Cascadia Code", "JetBrains Mono", monospace;
    font-size: 14px;
    line-height: 1.55;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  #window {
    width: 100%;
    max-width: 980px;
    background: var(--bg2);
    border: 1px solid var(--line);
    border-radius: 10px;
    box-shadow: 0 0 0 1px rgba(0,0,0,.6), 0 24px 60px rgba(0,0,0,.55);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    height: calc(100vh - 40px);
    min-height: 480px;
  }
  #titlebar {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 14px;
    background: #111a12;
    border-bottom: 1px solid var(--line);
    user-select: none;
  }
  .dot { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
  .dot.r { background: #ff5f56; } .dot.y { background: #ffbd2e; } .dot.g { background: #27c93f; }
  #title-text { margin-left: 8px; color: var(--dim); font-size: 12.5px; letter-spacing: .5px; flex: 1; }
  #title-text b { color: var(--accent); font-weight: 600; }
  #screen {
    flex: 1; overflow-y: auto; padding: 16px 18px;
    background:
      repeating-linear-gradient(0deg, transparent 0 2px, rgba(0,0,0,.12) 2px 4px);
    scrollbar-width: thin; scrollbar-color: #2a3a2c #0d130d;
  }
  #screen::-webkit-scrollbar { width: 8px; }
  #screen::-webkit-scrollbar-thumb { background: #2a3a2c; border-radius: 4px; }
  .line { white-space: pre-wrap; word-break: break-word; margin: 1px 0; }
  .line + .line { margin-top: 2px; }
  .prompt-host { color: var(--accent); font-weight: 700; }
  .prompt-user { color: var(--dim); }
  .prompt-sym { color: var(--bright); }
  .cmd { color: var(--bright); font-weight: 600; }
  .dim { color: var(--dim); }
  .accent { color: var(--accent); }
  .warn { color: var(--warn); }
  .err { color: var(--err); }
  .bold { font-weight: 700; color: var(--bright); }
  .block { margin: 8px 0 12px; padding-left: 14px; border-left: 2px solid #2a3a2c; }
  .block.accent-b { border-left-color: var(--accent); }
  table { border-collapse: collapse; width: 100%; margin: 8px 0; }
  th, td { text-align: left; padding: 5px 10px; border-bottom: 1px solid var(--line); font-size: 13.5px; vertical-align: top; }
  th { color: var(--accent); font-weight: 600; border-bottom: 1px solid #2f4532; }
  tr:hover td { background: rgba(0,212,170,.05); }
  .epnum { color: var(--warn); font-weight: 700; }
  .date { color: var(--dim); }
  .srch-hit { background: rgba(255,217,122,.25); color: var(--warn); border-radius: 2px; padding: 0 1px; }
  .kbd { border: 1px solid #2f4532; border-radius: 4px; padding: 1px 7px; font-size: 12px; color: var(--dim); background: #111a12; }
  #inputline { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); background: #0d130d; }
  #inputline .prompt-host { font-size: 15px; }
  #cmd { flex: 1; background: transparent; border: none; outline: none; color: var(--bright);
    font-family: inherit; font-size: 14.5px; caret-color: var(--accent); }
  #cmd::placeholder { color: #3d5c42; }
  .cursor { display: inline-block; width: 9px; height: 17px; background: var(--accent); animation: blink 1.1s step-end infinite; vertical-align: text-bottom; }
  @keyframes blink { 50% { opacity: 0; } }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .quote { color: var(--warn); font-style: italic; }
  .tiny { font-size: 12px; color: var(--dim); }
  .typing::after { content: "▌"; animation: blink 1.1s step-end infinite; color: var(--accent); }
  @media (max-width: 720px) {
    body { padding: 8px; }
    #window { height: calc(100vh - 16px); }
    #screen { padding: 12px; font-size: 13px; }
    th, td { padding: 4px 6px; font-size: 12.5px; }
  }
</style>
</head>
<body>
<div id="window">
  <div id="titlebar">
    <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
    <div id="title-text"><b>messy-action</b> — @gracebrodeur · 100 Days of Messy Action · transcript archive</div>
  </div>
  <div id="screen" role="log" aria-live="polite"></div>
  <div id="inputline">
    <span class="prompt-host">visitor@messy-action</span><span class="prompt-sym">:~$</span>
    <input id="cmd" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"
           placeholder="type `help` and press enter…" aria-label="terminal input">
  </div>
</div>

<script>
const DB_URL = 'database.json';
const screen = document.getElementById('screen');
const cmd = document.getElementById('cmd');
let DB = null;
let hist = [];
let histIdx = -1;

function el(cls, text) {
  const d = document.createElement('div');
  if (cls) d.className = cls;
  if (text !== undefined) d.textContent = text;
  return d;
}

function out(line) {
  if (typeof line === 'string') line = el('line', line);
  screen.appendChild(line);
  screen.scrollTop = screen.scrollHeight;
}
function hr() { out(el('line dim', '—'.repeat(72))); }
function spacer() { out(el('line', '')); }

function boot() {
  out(el('line accent', 'MESSY ACTION — TRANSCRIPT ARCHIVE v1.0'));
  out(el('line dim', 'series: 100 Days of Messy Action · creator: @gracebrodeur'));
  out(el('line dim', 'window: 2026-08-06 → 2026-11-15 · auto-updating daily'));
  spacer();
  out(el('line', 'initializing database…'));
  fetch(DB_URL).then(r => r.json()).then(d => {
    DB = d;
    out(el('line', `loaded <span class="accent">${d.episodes.length}</span> episodes · <span class="accent">${d.count}</span> total · ${d.episodes.reduce((a,e)=>a+e.transcript.split(/\s+/).length,0).toLocaleString()} words indexed`));
    spacer();
    out(el('line', 'type <span class="cmd">help</span> for commands, or just type to search all transcripts.'));
    out(el('line dim', 'try:  <span class="kbd">list</span>  <span class="kbd">ep 5</span>  <span class="kbd">search procrastination</span>  <span class="kbd">key 6</span>'));
    spacer();
    out(el('line dim', '───[ BOOT COMPLETE ]──────────────────────────────────────────'));
    spacer();
  }).catch(e => {
    out(el('line err', `failed to load database: ${e.message}`));
  });
}

function banner() {
  out(el('line accent', '█▀▄▀█ █▀▀ █▀▀ █▀▀ █▀▀▄   ▄▀▄ █▄ ▄█ █▀▄ █▀▀'));
  out(el('line accent', '█ ▀ █ █▀▀ ▀▀█ █▀▀ █▄▄▀   █▀█ █ ▀ █ █▀▄ █▀▀'));
  out(el('line accent', '▀   ▀ ▀▀▀ ▀▀▀ ▀▀▀ ▀ ▀▀▀   ▀ ▀ ▀   ▀ ▀ ▀ ▀▀▀'));
  spacer();
}

function fmtDate(d) { const [y,m,dd] = d.split('-'); return `${dd}.${m}.${y}`; }

function table(eps) {
  const t = document.createElement('table');
  const thead = document.createElement('thead');
  const tr = document.createElement('tr');
  ['EP','DATE','DUR','TITLE','KEY MESSAGE / QUOTE'].forEach(h => {
    const th = document.createElement('th'); th.textContent = h; tr.appendChild(th);
  });
  thead.appendChild(tr); t.appendChild(thead);
  const tb = document.createElement('tbody');
  eps.forEach(e => {
    const row = document.createElement('tr');
    const td1 = document.createElement('td'); td1.className = 'epnum'; td1.textContent = e.ep;
    const td2 = document.createElement('td'); td2.className = 'date'; td2.textContent = fmtDate(e.date);
    const td3 = document.createElement('td'); td3.className = 'date'; td3.textContent = Math.round(e.duration_s) + 's';
    const td4 = document.createElement('td');
    td4.innerHTML = `<span class="bold">${esc(e.title)}</span><div class="tiny">ig.com/reel/${esc(e.shortcode)}</div>`;
    const td5 = document.createElement('td');
    td5.innerHTML = `<div>${esc(e.key_message)}</div><div class="quote tiny">“${esc(e.quote)}”</div>`;
    [td1,td2,td3,td4,td5].forEach(td => row.appendChild(td));
    tb.appendChild(row);
  });
  t.appendChild(tb);
  return t;
}

function esc(s) { return (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function highlight(text, terms) {
  let s = esc(text);
  terms.forEach(t => {
    if (!t) return;
    const re = new RegExp(`(${t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
    s = s.replace(re, '<span class="srch-hit">$1</span>');
  });
  return s;
}

function showEp(ep) {
  banner();
  spacer();
  out(el('line', `<span class="epnum">EPISODE ${ep.ep}</span> · <span class="bold">${esc(ep.title)}</span>`));
  out(el('line dim', `date: ${fmtDate(ep.date)} · duration: ${Math.round(ep.duration_s)}s · code: ${ep.shortcode} · ig.com/reel/${ep.shortcode}`));
  spacer();
  const b = el('div block accent-b');
  b.innerHTML = `<span class="accent bold">KEY MESSAGE</span>\n${esc(ep.key_message)}\n\n<span class="warn bold">QUOTE</span>\n<span class="quote">“${esc(ep.quote)}”</span>`;
  out(b);
  spacer();
  const tb = el('div block');
  tb.innerHTML = `<span class="accent bold">FULL TRANSCRIPT (${ep.transcript.split(/\s+/).length} words)</span>`;
  out(tb);
  // print transcript in readable chunks with timestamps from segments if present
  if (ep.segments && ep.segments.length) {
    ep.segments.forEach(s => {
      const l = el('line');
      l.innerHTML = `<span class="dim">[${fmtTs(s.start)}]</span> ${esc(s.text)}`;
      out(l);
    });
  } else {
    out(el('line', ep.transcript));
  }
  spacer();
  out(el('line tiny', `-- ep ${ep.ep} of ${DB.episodes.length} · type "list" to go back --`));
}

function fmtTs(sec) {
  const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
  return `${String(m).padStart(1,'0')}:${String(s).padStart(2,'0')}`;
}

function search(terms) {
  const q = terms.join(' ').toLowerCase();
  const eps = DB.episodes;
  const results = [];
  eps.forEach(e => {
    const hay = (e.transcript + ' ' + e.key_message + ' ' + e.title).toLowerCase();
    let idx = 0, count = 0;
    while ((idx = hay.indexOf(q, idx)) !== -1) { count++; idx += q.length; }
    if (count) results.push({ep: e, count});
  });
  results.sort((a,b) => b.count - a.count);
  return results;
}

function cmdHelp() {
  banner();
  out(el('line bold accent', 'AVAILABLE COMMANDS'));
  spacer();
  const rows = [
    ['help', 'show this help'],
    ['list', 'list all episodes (table)'],
    ['ep <n>', 'open episode n: key message + full transcript'],
    ['search <terms>', 'full-text search across all transcripts'],
    ['key [n]', 'daily key message for episode n (default newest)'],
    ['procrastination', 'quick: every procrastination key message'],
    ['quotes', 'all episode quotes'],
    ['stats', 'database stats'],
    ['about', 'about this archive'],
    ['clear', 'clear screen'],
    ['exit', 'show a joke (you cannot leave)'],
  ];
  const t = document.createElement('table');
  rows.forEach(([c,d]) => {
    const tr = document.createElement('tr');
    const td1 = document.createElement('td'); td1.innerHTML = `<span class="accent">${c}</span>`;
    const td2 = document.createElement('td'); td2.textContent = d;
    tr.appendChild(td1); tr.appendChild(td2); t.appendChild(tr);
  });
  out(t);
  spacer();
  out(el('line dim', 'you can also just type a query — it becomes a full-text search.'));
}

function cmdList() {
  out(el('line', `<span class="accent bold">${DB.episodes.length} EPISODES</span> · 100 Days of Messy Action · @gracebrodeur`));
  hr();
  out(table(DB.episodes));
  out(el('line tiny', `-- type "ep N" for full transcript, "search <q>" for full-text --`));
}

function cmdKey(n) {
  const eps = DB.episodes;
  const ep = (n === null || n === undefined) ? eps[eps.length-1] : eps.find(e => e.ep === n);
  if (!ep) { out(el('line err', `episode ${n} not found (0-${eps.length-1})`)); return; }
  const b = el('div block accent-b');
  b.innerHTML = `<span class="dim">${fmtDate(ep.date)}</span> · <span class="epnum">EP ${ep.ep}</span> — <span class="bold">${esc(ep.title)}</span>\n\n<span class="accent bold">KEY MESSAGE</span>\n${esc(ep.key_message)}\n\n<span class="warn bold">QUOTE</span>\n<span class="quote">“${esc(ep.quote)}”</span>`;
  out(b);
}

function cmdP() {
  out(el('line', '<span class="accent bold">PROCRASTINATION — ALL EPISODES</span>'));
  hr();
  const eps = DB.episodes.filter(e => e.tag === 'procrastination');
  if (!eps.length) { out(el('line dim','no episodes tagged')); return; }
  eps.forEach(e => cmdKey(e.ep));
}

function cmdQuotes() {
  out(el('line', '<span class="accent bold">QUOTES</span>'));
  hr();
  DB.episodes.forEach(e => {
    const l = el('line');
    l.innerHTML = `<span class="epnum">EP${e.ep}</span> <span class="date">${fmtDate(e.date)}</span>  <span class="quote">“${esc(e.quote)}”</span>`;
    out(l);
  });
}

function cmdStats() {
  const eps = DB.episodes;
  const totalWords = eps.reduce((a,e) => a + e.transcript.split(/\s+/).length, 0);
  const totalSec = eps.reduce((a,e) => a + e.duration_s, 0);
  out(el('line', `<span class="accent bold">DATABASE STATS</span>`));
  hr();
  [
    ['episodes', eps.length],
    ['total runtime', Math.round(totalSec/60) + ' min'],
    ['total words', totalWords.toLocaleString()],
    ['avg words/ep', Math.round(totalWords/eps.length).toLocaleString()],
    ['tags', [...new Set(eps.map(e=>e.tag))].join(', ')],
    ['generated', DB.generated],
    ['source', '@gracebrodeur · instagram'],
  ].forEach(([k,v]) => {
    const l = el('line'); l.innerHTML = `<span class="accent">${k.padEnd(16)}</span>${esc(String(v))}`; out(l);
  });
  hr();
}

function cmdAbout() {
  out(el('line bold', '100 DAYS OF MESSY ACTION — ARCHIVE'));
  out(el('line', 'Daily public experiment by Grace Brodeur (@gracebrodeur): can you hit a'));
  out(el('line', 'delusional goal by training your brain to believe it is possible and'));
  out(el('line', 'taking messy action before you feel ready?'));
  spacer();
  out(el('line dim', '2021 track record: $1.7M business teaching procrastination recovery,'));
  out(el('line dim', '$100K in 9 months from a delusional goal, now aiming for 1M helped.'));
  spacer();
  out(el('line dim', 'This archive auto-ingests each day\'s episode: video → audio → transcript →'));
  out(el('line dim', 'key message → database. Built by Paridhi for Vivek.'));
}

function runCommand(raw) {
  const line = el('line');
  line.innerHTML = `<span class="prompt-host">visitor@messy-action</span><span class="prompt-sym">:~$</span> <span class="cmd">${esc(raw)}</span>`;
  out(line);
  const parts = raw.trim().split(/\s+/);
  const c = (parts[0]||'').toLowerCase();
  const args = parts.slice(1);

  if (!DB) {
    if (c === 'help' || c === 'clear') { /* allow */ }
    else { out(el('line err', 'database still loading… try again in a second.')); return; }
  }

  switch (c) {
    case 'help': cmdHelp(); break;
    case 'list': case 'ls': case 'videos': cmdList(); break;
    case 'ep': {
      const n = parseInt(args[0], 10);
      if (isNaN(n)) { out(el('line err', 'usage: ep <number>')); break; }
      const ep = DB.episodes.find(e => e.ep === n);
      if (!ep) out(el('line err', `episode ${n} not found. try: list`));
      else showEp(ep);
      break;
    }
    case 'search': case 'find': case 'grep': {
      if (!args.length) { out(el('line err', 'usage: search <terms>')); break; }
      const results = search(args);
      if (!results.length) { out(el('line warn', `no matches for "${args.join(' ')}"`)); break; }
      out(el('line', `<span class="accent bold">${results.length} EPISODE(S)</span> match "<span class="warn">${esc(args.join(' '))}</span>"`));
      hr();
      results.forEach(r => {
        const b = el('div block');
        const idx = r.ep.transcript.toLowerCase().indexOf(args.join(' ').toLowerCase());
        const start = Math.max(0, idx - 90);
        let excerpt = r.ep.transcript.slice(start, idx + 160);
        if (start > 0) excerpt = '…' + excerpt;
        b.innerHTML = `<span class="epnum">EP ${r.ep.ep}</span> <span class="date">${fmtDate(r.ep.date)}</span> · <span class="bold">${esc(r.ep.title)}</span> · <span class="dim">${r.count} hit(s)</span>\n<span class="dim">${highlight(excerpt, args)}</span>`;
        b.addEventListener('click', () => { cmd.value = `ep ${r.ep.ep}`; runCommand(cmd.value); });
        b.style.cursor = 'pointer';
        out(b);
      });
      hr();
      out(el('line tiny', '-- click a result to open the episode --'));
      break;
    }
    case 'key': case 'message': case 'daily': {
      const n = args.length ? parseInt(args[0],10) : null;
      cmdKey(isNaN(n) ? null : n);
      break;
    }
    case 'procrastination': case 'proc': cmdP(); break;
    case 'quotes': case 'quote': cmdQuotes(); break;
    case 'stats': case 'db': cmdStats(); break;
    case 'about': cmdAbout(); break;
    case 'clear': case 'cls': screen.innerHTML = ''; break;
    case 'exit': case 'quit': out(el('line warn', 'nice try. there is no exit from messy action.')); break;
    case 'banner': banner(); break;
    case '': break;
    default: {
      // implicit full-text search
      const results = search(parts);
      if (!results.length) { out(el('line err', `command not found: ${c} — type "help". (no transcript matches either)`)); break; }
      out(el('line dim', `(implicit search: "${esc(raw)}")`));
      const r0 = results[0];
      out(el('line', `<span class="accent bold">${results.length} episode(s)</span> match — top: <span class="epnum">EP ${r0.ep.ep}</span> <span class="bold">${esc(r0.ep.title)}</span> (${r0.count} hits)`));
      hr();
      results.slice(0, 5).forEach(r => {
        const idx = r.ep.transcript.toLowerCase().indexOf(parts.join(' ').toLowerCase());
        const start = Math.max(0, idx - 80);
        let excerpt = r.ep.transcript.slice(start, idx + 140);
        if (start > 0) excerpt = '…' + excerpt;
        const l = el('line');
        l.innerHTML = `<span class="epnum">EP ${r.ep.ep}</span> <span class="dim">${highlight(excerpt, parts)}</span>`;
        out(l);
      });
      hr();
      out(el('line tiny', '-- type "ep N" to open, "search <q>" for details --'));
    }
  }
  spacer();
  screen.scrollTop = screen.scrollHeight;
}

cmd.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const raw = cmd.value;
    if (!raw.trim()) return;
    hist.push(raw); histIdx = hist.length;
    cmd.value = '';
    runCommand(raw);
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (histIdx > 0) { histIdx--; cmd.value = hist[histIdx]; }
  } else if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (histIdx < hist.length - 1) { histIdx++; cmd.value = hist[histIdx]; }
    else { histIdx = hist.length; cmd.value = ''; }
  }
});

cmd.addEventListener('keyup', () => {
  cmd.style.width = 'auto';
});

boot();
setTimeout(() => cmd.focus(), 400);
window.addEventListener('click', () => cmd.focus());
</script>
</body>
</html>
